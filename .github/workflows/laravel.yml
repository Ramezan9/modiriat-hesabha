name: Laravel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: دریافت فایل‌های مخزن
        uses: actions/checkout@v4

      - name: نصب PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo, pdo_sqlite
          tools: composer

      - name: آماده‌سازی محیط Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: ساخت دیتابیس SQLite
        run: |
          touch database/database.sqlite

      - name: نصب وابستگی‌ها
        run: |
          composer install --no-interaction --prefer-dist --no-progress

      - name: اجرای Migrationها
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan migrate --force

      - name: اجرای تست‌ها
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan test
